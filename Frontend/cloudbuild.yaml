steps:
  # -----------------------------------------------------------
  # ขั้นตอนที่ 1: Build Docker image และ Push ไปยัง Artifact Registry
  # -----------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        # ชื่อ Image ที่ถูกต้องจะถูกสร้างจากตัวแปรข้างล่าง
        '${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY_NAME}/${_SERVICE_NAME}:$COMMIT_SHA',
        '.',
      ]
    id: 'Build and Push Image'

  # -----------------------------------------------------------
  # ขั้นตอนที่ 2: Deploy Image ไปยัง Google Cloud Run
  # -----------------------------------------------------------
  - name: 'gcr.io/google-cloud-builders/gcloud'
    args:
      [
        'run',
        'deploy',
        '${_SERVICE_NAME}',
        '--image',
        '${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY_NAME}/${_SERVICE_NAME}:$COMMIT_SHA',
        '--region',
        '${_LOCATION}', # ใช้ _LOCATION ที่ถูกต้อง
        '--platform',
        'managed',
        '--allow-unauthenticated',
      ]
    id: 'Deploy to Cloud Run'

# ระบุ images ที่จะถูก push ไปยัง Artifact Registry
images:
  - '${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY_NAME}/${_SERVICE_NAME}:$COMMIT_SHA'

# กำหนดค่า Timeout
timeout: '1600s'

# -----------------------------------------------------------
# --- ⬇️ แก้ไขส่วนนี้ให้ถูกต้อง ⬇️ ---
# -----------------------------------------------------------
substitutions:
  # แก้ไข LOCATION: ห้ามมีวงเล็บหรือช่องว่าง
  _LOCATION: 'us-central1'
  
  # แก้ไข PROJECT_ID: ต้องเป็นตัวพิมพ์เล็กทั้งหมด
  _PROJECT_ID: 'ydoitung-478412' # (โปรดตรวจสอบ Project ID จริงของคุณ)
  
  # นี่คือค่าจากใน Error ของคุณ
  _REPOSITORY_NAME: 'doitung'
  _SERVICE_NAME: 'doi-tung-laundry'

# บอกให้ Cloud Build ส่ง Log ไปที่ Cloud Logging โดยตรง
options:
  logging: CLOUD_LOGGING_ONLY