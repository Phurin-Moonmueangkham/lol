steps:
  # -----------------------------------------------------------
  # ขั้นตอนที่ 1: Build Docker image และ Push ไปยัง Artifact Registry
  # -----------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        # แทนที่ LOCATION, PROJECT_ID, REPOSITORY_NAME, และ SERVICE_NAME
        # ตัวอย่าง: 'asia-southeast1-docker.pkg.dev/my-project/my-repo/doi-tung-laundry:$COMMIT_SHA'
        '${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY_NAME}/${_SERVICE_NAME}:$COMMIT_SHA',
        '.',
      ]
    id: 'Build and Push Image'

  # -----------------------------------------------------------
  # ขั้นตอนที่ 2: Deploy Image ไปยัง Google Cloud Run
  # -----------------------------------------------------------
  - name: 'gcr.io/google-cloud-builders/gcloud'
    args:
      [
        'run',
        'deploy',
        # แทนที่ SERVICE_NAME
        '${_SERVICE_NAME}',
        '--image',
        # อ้างอิง Image ที่สร้างในขั้นตอนที่ 1
        '${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY_NAME}/${_SERVICE_NAME}:$COMMIT_SHA',
        # แทนที่ LOCATION (Region)
        '--region',
        '${_LOCATION}',
        '--platform',
        'managed',
        # --- ทำให้เว็บเข้าถึงได้แบบสาธารณะ ---
        '--allow-unauthenticated',
      ]
    id: 'Deploy to Cloud Run'

# ระบุ images ที่จะถูก push ไปยัง Artifact Registry
images:
  - '${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY_NAME}/${_SERVICE_NAME}:$COMMIT_SHA'

# กำหนดค่าตัวแปร (Substitutions) ที่จะใช้ในไฟล์นี้
# คุณสามารถเปลี่ยนค่า default หรือส่งค่าใหม่เข้ามาตอนรัน gcloud builds submit
substitutions:
  _LOCATION: 'us-central1 (lowa)' # เช่น asia-southeast1 (กรุงเทพ)
  _PROJECT_ID: 'Ydoitung-478412' # ใส่ Project ID ของคุณ
  _REPOSITORY_NAME: 'doitung' # ใส่ชื่อ Artifact Registry Repository
  _SERVICE_NAME: 'doi-tung-laundry' # ตั้งชื่อบริการ Cloud Run

# ตั้งค่า Timeout
timeout: '1600s'